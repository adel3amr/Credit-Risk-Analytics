name: Stress Sensitivity Experiment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_sme_portfolio.py
      - run: python experiments/stress_sensitivity_testing.py
