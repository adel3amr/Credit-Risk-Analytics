name: WOE Credit Scorecard Experiment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  woe-scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python experiments/woe_credit_scorecard.py
