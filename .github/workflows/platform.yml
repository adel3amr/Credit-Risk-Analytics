name: Platform reference validation
on:
  push:
    branches: ['platform/**', 'review/final-red-team-release', 'feature/final-platform-closeout', 'research/lgd-workout-engine-vnext', 'release/final-institutional-platform']
  pull_request:
    paths: ['workout_vnext/**', 'marginal_interest/**', 'tests/test_marginal_interest.py', 'credit_platform/**', 'research_diagnostics/**', 'synthetic_bank/**', 'economic_lgd/**', 's2_remediation/**', 'lgd_hardening/**', 'migrations/**', 'tests/platform/**', 'requirements-platform*.txt', 'compose.yaml', 'Dockerfile', 'scripts/platform*', '.github/workflows/platform.yml']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditrisk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-platform-lock.txt
      - run: python scripts/run_v5.py
      - run: python -m credit_platform.cli build-models
      - run: python scripts/platform_verify_frozen.py
      - run: python -m synthetic_bank.validate
      - name: Verify frozen S2 remediation without re-opening holdout
        run: python -c "from s2_remediation.evaluate import verify, verify_lock; verify(); verify_lock()"
      - name: Verify frozen workout evidence without refitting or selecting models
        run: python -c "from credit_platform.workout_evidence import get; get()"
      - run: python -m pytest -q
      - name: PostgreSQL migrations and full shadow calculation
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ephemeral-ci-only@localhost:5432/creditrisk_test
        run: |
          python -m alembic upgrade head
          python scripts/platform_shadow.py
          python -m credit_platform.cli audit-verify
          WORKOUT_DATABASE_URL="$DATABASE_URL" python -m workout_vnext.persist
      - name: Streamlit workbench headless smoke
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ephemeral-ci-only@localhost:5432/creditrisk_test
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/streamlit.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/streamlit.log
            exit 1
          fi
          kill "$ui_pid" 2>/dev/null || true
          wait "$ui_pid" 2>/dev/null || true
      - name: Compile modules
        run: python -m compileall -q credit_platform economic_lgd s2_remediation lgd_hardening marginal_interest workout_vnext
      - name: Container build
        run: docker build -t credit-risk-reference .
      - uses: actions/upload-artifact@v4
        with:
          name: platform-reference-evidence
          path: |
            platform_evidence/shadow_execution.json
            platform_evidence/worked_cases.json
            outputs/v5_release_checks.csv
