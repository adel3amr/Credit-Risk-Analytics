name: Validate V3 Interface

on:
  push:
    branches: [feature/v3-governance-interface, feature/v4-bank-grade-risk-engine]
  pull_request:
    branches: [main, fix/reviewer-code-only]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m py_compile app.py src/governance.py
      - name: Generate app data
        run: |
          python scripts/generate_sme_portfolio.py
          python scripts/generate_lgd_workout_history.py
          python notebooks/lgd_model_pipeline.py
          python notebooks/credit_risk_pipeline.py
      - name: Streamlit runtime smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py").run(timeout=30)
          assert not at.exception, [str(x) for x in at.exception]
          PY
