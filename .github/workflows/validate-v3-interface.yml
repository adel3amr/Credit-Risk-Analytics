name: Validate V3 Interface

on:
  push:
    branches: [feature/v3-governance-interface]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_governance.py
      - run: python -m py_compile app.py src/governance.py
