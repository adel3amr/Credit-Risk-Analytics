name: Validate V5 Interface

on:
  push:
    branches: [feature/v3-governance-interface, feature/v4-bank-grade-risk-engine, feature/v5-lgd-validation-hardening]
  pull_request:
    branches: [main, fix/reviewer-code-only, feature/v4-bank-grade-risk-engine]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-v5.txt
      - run: python -m pytest -q
      - run: python -m py_compile app.py src/governance.py
      - name: Generate app data
        run: |
          python scripts/generate_sme_portfolio.py
          python scripts/generate_lgd_workout_history.py
          python notebooks/lgd_model_pipeline.py
          python notebooks/credit_risk_pipeline.py
          python notebooks/lgd_governance_diagnostics.py
          python scripts/validate_v5.py
      - name: Streamlit runtime smoke test
        run: python scripts/test_dashboard.py
